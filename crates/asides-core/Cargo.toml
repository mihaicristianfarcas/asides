[package]
name = "asides-core"
description = "Notes, metadata and links shared by the asides CLI and the asides menu-bar app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
chrono.workspace = true
libc = "0.2"
notify = "8"
rustc-demangle = "0.1"
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
url.workspace = true
zip.workspace = true

[target.'cfg(not(target_os = "macos"))'.dependencies]
# Wispr Flow's and OpenCode's databases: Windows has no `sqlite3` command, and Linux may not.
rusqlite = { version = "0.37", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Environment",
    "Win32_System_Kernel",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# Whether terminals can be typed into, and what does the typing (`sessions_linux.rs`).
asides-keys = { path = "../asides-keys" }
# Monitors, as the X server lays them out (`display.rs`).
x11rb = { version = "0.13", features = ["randr", "resource_manager"] }
# xdg-desktop-portal, which Wayland desktops do things through (`portal.rs`).
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[dev-dependencies]
tempfile.workspace = true
