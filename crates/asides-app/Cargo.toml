[package]
name = "asides-app"
description = "asides: a macOS menu-bar app that turns spoken bug reports into Markdown notes, transcribed locally"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "asides-app"
path = "src/main.rs"

[features]
# Enables `asides simulate` (feed a WAV as if recorded). Used by the end-to-end test only.
dev-hooks = []

[dependencies]
asides-core.workspace = true
anyhow.workspace = true
chrono.workspace = true
serde_json.workspace = true
url.workspace = true
zip.workspace = true
cpal = "0.18"
hound = "3.5"
sha2 = "0.11"
ureq = "3"

# The event loop, global shortcuts and the status item on a Mac and on Windows. On Linux they'd bring
# GTK and libappindicator: there it's `linux/` (a channel, X11 and D-Bus, the StatusNotifierItem).
[target.'cfg(not(target_os = "linux"))'.dependencies]
global-hotkey = "0.8"
tao = "0.37"
tray-icon = "0.26"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
libc = "0.2"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-av-foundation = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-foundation = "0.3"
objc2-screen-capture-kit = "0.3"
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation"] }
whisper-rs = { version = "0.16", features = ["metal"] }

[target.'cfg(windows)'.dependencies]
# The clipboard: text, and screenshots as PNG and as a bitmap (what Windows apps paste).
arboard = { version = "3", default-features = false, features = ["image-data"] }
png = "0.18"
# On the processor: Windows PCs have no one GPU API whisper.cpp builds for everywhere.
whisper-rs = "0.16"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# The clipboard: text and screenshots, through X11 (Xwayland on a Wayland desktop).
arboard = { version = "3", default-features = false, features = ["image-data"] }
libc = "0.2"
png = "0.18"
serde.workspace = true
# On the processor, as on Windows: no one GPU API whisper.cpp builds for everywhere.
whisper-rs = "0.16"
x11rb = { version = "0.13", features = ["randr", "xkb"] }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
# The status item (StatusNotifierItem), without GTK.
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }

[dev-dependencies]
tempfile.workspace = true

[build-dependencies]
# The Windows programs' icon (packaging/asides.ico) and version information.
winresource = "0.1"
