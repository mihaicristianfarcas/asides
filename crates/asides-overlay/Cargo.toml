[package]
name = "asides-overlay"
description = "asides' Measure & Annotate overlay: measure, annotate, draw and talk over a frozen screen (GPUI)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "asides-overlay"
path = "src/main.rs"

[dependencies]
asides-core.workspace = true
anyhow.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
# Shaders compiled at launch (Metal caches them): building needs no Metal toolchain (full Xcode).
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
futures = "0.3"
image = { version = "0.25", default-features = false }
raw-window-handle = "0.6"
unicode-segmentation = "1"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-core-foundation = "0.3"
objc2-foundation = "0.3"
objc2-core-graphics = "0.3"
# Already AppKit's: the pill's window comes in (`native::appear`).
objc2-quartz-core = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "CAAnimation",
    "CALayer",
    "CAMediaTiming",
    "CAMediaTimingFunction",
    "CATransaction",
    "CATransform3D",
] }

[target.'cfg(windows)'.dependencies]
# Exported images (`win/export.rs`): shapes, and labels in Windows' own typeface.
ab_glyph = "0.2"
tiny-skia = "0.11"
arboard = { version = "3", default-features = false, features = ["image-data"] }
windows = { version = "0.61", features = [
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile.workspace = true

[build-dependencies]
# The Windows programs' icon (packaging/asides.ico) and version information.
winresource = "0.1"
