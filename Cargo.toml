[workspace]
resolver = "3"
members = ["crates/asides-core", "crates/asides-cli", "crates/asides-app", "crates/asides-overlay"]
# GPUI, patched (third_party/gpui/PATCHES.md): not ours to lint or test.
exclude = ["third_party/gpui"]

[workspace.package]
version = "1.0.8"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mihaicristianfarcas/asides"

[workspace.dependencies]
asides-core = { path = "crates/asides-core" }
anyhow = "1"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
url = "2"
tempfile = "3"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[profile.release]
lto = "thin"

# GPUI 0.2.2 with a few changes its Linux backends need (third_party/gpui/PATCHES.md).
[patch.crates-io]
gpui = { path = "third_party/gpui" }
