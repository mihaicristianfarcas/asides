# Blank issues stay on: CONTRIBUTING.md asks for anything bigger than a fix to be opened as an
# issue first, and no form fits one.
blank_issues_enabled: true
contact_links:
  - name: Question
    url: https://github.com/mihaicristianfarcas/asides/discussions/categories/q-a
    about: Ask how to set up or use asides.
  - name: Security problem
    url: https://github.com/mihaicristianfarcas/asides/security/advisories/new
    about: Report it privately, not in an issue.
