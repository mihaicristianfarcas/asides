<!doctype html>
<!-- The desktop the README's picture and Help's clips are drawn on (scripts/make-screenshot.py and
     make-help.py take its pieces): a 14-inch MacBook Pro
     with Safari on a checkout page and Claude Code in Terminal. Not served: docs/ is the website. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
:root {
  /* One look, light, whatever the system is. */
  color-scheme: light;
  --bg: #fff;
  --fg: #111113;
  --muted: #6e6e73;
  --line: #e8e8ec;
  --code-bg: #f5f5f7;
  /* The app's own color (style.rs's UI, "soft blue cloud"): the main buttons, selections, focus.
     The focus ring takes its deeper shade on white, to be seen. */
  --accent: #92b6f0;
  --accent-fill: #c2d6f6;
  --accent-wash: #eff4fc;
  --accent-ink: #3e64a8;
  --on-accent: #16213a;
  /* Recording, red as in the menu bar. */
  --red: #ff3b30;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 16px/1.6 var(--sans);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-x: clip;
}
h1, h2, h3, p, ul, ol, dl, dd { margin: 0; padding: 0; font-size: inherit; font-weight: inherit; }
code, pre, kbd, button { font-size: inherit; }
code, pre { font-family: var(--mono); }
.mark { display: inline-flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; text-decoration: none; }
.mark svg { width: 19px; height: 19px; }

/* Demo: a 14-inch MacBook Pro's screen, 1512 × 945 points, drawn after macOS 26. --u is one
   point of it, so the whole desktop scales with the page, phones included, and every size is the
   real one (the menu bar's 37 pt, 13 pt text, the overlay's 28 pt buttons). Its text is part of the
   picture and scales with it; the subtitles don't. */
.device {
  margin: 0;
  padding: 10px;
  background: #0b0b0c;
  border-radius: 22px;
  box-shadow: 0 0 0 1px #2c2c2e inset, 0 32px 64px -28px rgba(0, 0, 0, 0.45);
}
.display { position: relative; container-type: inline-size; aspect-ratio: 1512 / 945; border-radius: 12px; overflow: hidden; }
.desk, .hud { --u: calc(100cqw / 1512); }
.desk {
  position: absolute;
  inset: 0;
  overflow: hidden;
  background: #2e2a5c url(wallpaper.webp) 50% 50% / cover;
  font: 400 calc(13 * var(--u))/1.25 var(--sans);
  letter-spacing: -0.003em;
  color: #1d1d1f;
  user-select: none;
  -webkit-user-select: none;
}
.desk svg { display: block; flex: none; }

/* The menu bar: no bar at all since macOS 26, white text on the wallpaper, around the notch. */
.menubar {
  position: absolute;
  inset: 0 0 auto;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: calc(37 * var(--u));
  padding: 0 calc(10 * var(--u)) 0 calc(20 * var(--u));
  color: #fff;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  text-shadow: 0 0 calc(3 * var(--u)) rgba(0, 0, 0, 0.22);
}
.menus, .extras { display: flex; align-items: center; height: 100%; }
.menus { gap: calc(21 * var(--u)); }
.menus b { font-weight: 700; }
.menus svg { width: calc(14 * var(--u)); height: calc(17 * var(--u)); margin-right: calc(3 * var(--u)); fill: currentColor; filter: drop-shadow(0 0 calc(3 * var(--u)) rgba(0, 0, 0, 0.2)); }
.extras { gap: calc(4 * var(--u)); }
.extras > svg, .extras > .status { filter: drop-shadow(0 0 calc(3 * var(--u)) rgba(0, 0, 0, 0.2)); }
.extras > svg { width: calc(30 * var(--u)); height: calc(16 * var(--u)); padding: 0 calc(7 * var(--u)); }
.extras .battery { width: calc(40 * var(--u)); }
.clock { padding-left: calc(8 * var(--u)); }
.notch {
  position: absolute;
  top: 0;
  left: 50%;
  width: calc(186 * var(--u));
  height: calc(32 * var(--u));
  transform: translateX(-50%);
  background: #000;
  border-radius: 0 0 calc(10 * var(--u)) calc(10 * var(--u));
}
/* The small concave fillets where the notch meets the bezel. */
.notch::before, .notch::after { content: ""; position: absolute; top: 0; width: calc(6 * var(--u)); height: calc(6 * var(--u)); }
.notch::before { left: calc(-6 * var(--u)); background: radial-gradient(circle at 0 100%, transparent 70%, #000 72%); }
.notch::after { right: calc(-6 * var(--u)); background: radial-gradient(circle at 100% 100%, transparent 70%, #000 72%); }

.status {
  display: inline-flex;
  align-items: center;
  gap: calc(4 * var(--u));
  height: calc(24 * var(--u));
  padding: 0 calc(8 * var(--u));
  border-radius: calc(7 * var(--u));
  white-space: nowrap;
}
.status.open { background: rgba(255, 255, 255, 0.24); }
.status svg { display: none; width: calc(18 * var(--u)); height: calc(18 * var(--u)); }
.status[data-state="idle"] .i-idle,
.status[data-state="rec"] .i-rec,
.status[data-state="busy"] .i-busy,
.status[data-state="done"] .i-done { display: block; }
/* Windows: macOS 26's rounder corners and soft shadows. */
.win {
  position: absolute;
  overflow: hidden;
  background: #fff;
  border-radius: calc(16 * var(--u));
  box-shadow: 0 0 0 calc(0.5 * var(--u)) rgba(0, 0, 0, 0.22), 0 calc(16 * var(--u)) calc(48 * var(--u)) rgba(0, 0, 0, 0.3);
}
.bar {
  position: relative;
  display: flex;
  align-items: center;
  gap: calc(6 * var(--u));
  padding: 0 calc(12 * var(--u)) 0 calc(20 * var(--u));
  color: #4b4b50;
}
.bar svg { width: calc(30 * var(--u)); height: calc(30 * var(--u)); padding: calc(7 * var(--u)); border-radius: 50%; }
.lights { display: flex; gap: calc(9 * var(--u)); margin-right: calc(14 * var(--u)); }
.lights i { width: calc(13 * var(--u)); height: calc(13 * var(--u)); border-radius: 50%; box-shadow: 0 0 0 calc(0.5 * var(--u)) rgba(0, 0, 0, 0.12) inset; }
.lights i:nth-child(1) { background: #ff5f57; }
.lights i:nth-child(2) { background: #febc2e; }
.lights i:nth-child(3) { background: #28c840; }
.inactive .lights i { background: #d9d9dc; }
.inactive { box-shadow: 0 0 0 calc(0.5 * var(--u)) rgba(0, 0, 0, 0.18), 0 calc(8 * var(--u)) calc(24 * var(--u)) rgba(0, 0, 0, 0.18); }

/* Safari 26's compact toolbar: one row, the address in a glass pill, over the page. */
.safari { top: calc(62 * var(--u)); left: calc(24 * var(--u)); width: calc(940 * var(--u)); height: calc(820 * var(--u)); }
.safari .bar { height: calc(52 * var(--u)); background: #fff; }
.url {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: calc(6 * var(--u));
  width: calc(420 * var(--u));
  height: calc(34 * var(--u));
  margin: 0 auto;
  color: #1d1d1f;
  background: rgba(0, 0, 0, 0.045);
  border-radius: calc(17 * var(--u));
  box-shadow: 0 0 0 calc(0.5 * var(--u)) rgba(0, 0, 0, 0.06) inset;
}
.url svg { width: calc(14 * var(--u)); height: calc(14 * var(--u)); padding: 0; color: #8e8e93; }

/* The page being tested, with its two bugs: the summary card is jammed under the sticky header,
   and the Pay button's text wraps. */
.site { height: calc(768 * var(--u)); background: #faf8f4; color: #23271f; }
.site-head {
  display: flex;
  align-items: center;
  gap: calc(26 * var(--u));
  height: calc(56 * var(--u));
  padding: 0 calc(40 * var(--u));
  background: #fff;
  border-bottom: calc(1 * var(--u)) solid #e8e4dc;
  color: #6b6f66;
  font-size: calc(14 * var(--u));
}
.logo { display: flex; align-items: center; gap: calc(7 * var(--u)); margin-right: auto; font-weight: 700; font-size: calc(17 * var(--u)); color: #2f5d3a; letter-spacing: -0.01em; }
.logo svg { width: calc(18 * var(--u)); height: calc(18 * var(--u)); }
.cart { color: #23271f; font-weight: 600; }
.site-body { display: flex; gap: calc(40 * var(--u)); max-width: calc(900 * var(--u)); margin: 0 auto; padding: 0 calc(40 * var(--u)); }
.form { flex: 1; padding-top: calc(36 * var(--u)); font-size: calc(14 * var(--u)); }
.form h4 { margin: 0 0 calc(18 * var(--u)); font-size: calc(26 * var(--u)); font-weight: 700; letter-spacing: -0.02em; }
.form .label { margin: calc(18 * var(--u)) 0 calc(7 * var(--u)); font-size: calc(11 * var(--u)); font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #8a8d84; }
.field {
  display: flex;
  align-items: center;
  height: calc(38 * var(--u));
  padding: 0 calc(13 * var(--u));
  background: #fff;
  border: calc(1 * var(--u)) solid #dedad1;
  border-radius: calc(8 * var(--u));
}
.form > .field + .field, .form > .pair + .field, .form > .field + .pair { margin-top: calc(10 * var(--u)); }
.pair { display: flex; gap: calc(10 * var(--u)); }
.pair .field { flex: 1; }
.dim { color: #9a9d94; }
.card {
  flex: none;
  align-self: flex-start;
  width: calc(320 * var(--u));
  padding: calc(6 * var(--u)) calc(20 * var(--u)) calc(20 * var(--u));
  font-size: calc(14 * var(--u));
  background: #fff;
  border: calc(1 * var(--u)) solid #e8e4dc;
  border-top: 0;
  border-radius: 0 0 calc(12 * var(--u)) calc(12 * var(--u));
}
.card h5 { margin: 0 0 calc(14 * var(--u)); font-size: calc(15 * var(--u)); font-weight: 700; }
.line { display: flex; align-items: center; gap: calc(11 * var(--u)); }
.line + .line { margin-top: calc(11 * var(--u)); }
.line span:first-of-type { flex: 1; }
.thumb { flex: none; width: calc(38 * var(--u)); height: calc(38 * var(--u)); border-radius: calc(7 * var(--u)); }
.thumb.tote { background: linear-gradient(160deg, #e9dcc3, #d4c09b); }
.thumb.book { background: linear-gradient(160deg, #7fa37a, #4f7a52); }
.rule { height: calc(1 * var(--u)); margin: calc(14 * var(--u)) 0; background: #eeebe4; }
.total { font-weight: 700; }
.pay {
  width: calc(124 * var(--u));
  margin-top: calc(18 * var(--u));
  padding: calc(8 * var(--u)) calc(14 * var(--u));
  border-radius: calc(9 * var(--u));
  background: #2f5d3a;
  color: #fff;
  font-weight: 600;
  text-align: center;
}

/* Terminal beside Safari, with Claude Code: the aside arrives in its chat while Safari stays in
   front. The chat starts at the top; once it fills the window, older lines leave at the top. */
.term {
  top: calc(62 * var(--u));
  left: calc(976 * var(--u));
  width: calc(512 * var(--u));
  height: calc(560 * var(--u));
  background: #1e1e1e;
}
.term .bar { height: calc(28 * var(--u)); background: #2d2d2d; color: #a1a1a6; border-bottom: calc(1 * var(--u)) solid #111; }
.term.inactive .bar { background: #282828; }
.term.inactive .lights i { background: #48484b; }
.term-title { position: absolute; left: 50%; transform: translateX(-50%); font-weight: 600; }
.screen {
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  gap: calc(9 * var(--u));
  height: calc(532 * var(--u));
  overflow: hidden;
  padding: calc(12 * var(--u)) calc(16 * var(--u));
  font: calc(12 * var(--u))/1.5 var(--mono);
  color: #e5e5e5;
}
.screen::after { content: ""; flex: 1 0 0; margin-top: calc(-9 * var(--u)); }
.screen p { margin: 0; white-space: pre-wrap; }
.screen [hidden] { display: none; }
.screen .you { padding: calc(2 * var(--u)) calc(7 * var(--u)); background: #2b2b2b; color: #b8b8b8; }
/* Like Claude Code, a message's lines go under its text, not under its > or ⏺. */
.screen .aside, .screen .reply { padding-left: calc(7 * var(--u) + 2ch); text-indent: -2ch; }
.screen .reply { padding-left: 2ch; }
.screen .star { color: #d97757; }
.screen .dim { color: #8a8a8e; }
.input {
  display: flex;
  align-items: center;
  gap: calc(8 * var(--u));
  min-height: calc(32 * var(--u));
  margin-top: calc(4 * var(--u));
  padding: 0 calc(11 * var(--u));
  border: calc(1 * var(--u)) solid #5a5a5e;
  border-radius: calc(7 * var(--u));
}
.caret { width: calc(8 * var(--u)); height: calc(16 * var(--u)); background: #d4d4d4; }
.typed b { font-weight: 400; color: #a8c7fa; }

/* The keys being pressed, and the pointer */
/* Above the subtitles, which can show at the same moment. */
.hud {
  position: absolute;
  bottom: calc(150 * var(--u));
  left: 50%;
  z-index: 9;
  padding: calc(12 * var(--u)) calc(24 * var(--u));
  border-radius: calc(18 * var(--u));
  background: rgba(28, 28, 30, 0.78);
  -webkit-backdrop-filter: blur(calc(16 * var(--u)));
  backdrop-filter: blur(calc(16 * var(--u)));
  color: #fff;
  font-size: calc(36 * var(--u));
  font-weight: 500;
  letter-spacing: 0.06em;
  white-space: nowrap;
  opacity: 0;
  transform: translateX(-50%) scale(0.94);
  transition: opacity 160ms ease-out, transform 160ms ease-out;
}
.hud.on { opacity: 1; transform: translateX(-50%); }
.pointer {
  position: absolute;
  top: 0;
  left: 0;
  z-index: 10;
  opacity: 0;
  transform: translate(calc(var(--x, 800) * var(--u)), calc(var(--y, 600) * var(--u)));
  transition: transform var(--move, 0ms) cubic-bezier(0.4, 0, 0.3, 1), opacity 200ms ease;
}
.pointer.on { opacity: 1; }
.pointer svg { position: absolute; transition: transform 90ms ease-out; }
.pointer .arrow { top: calc(-3 * var(--u)); left: calc(-5 * var(--u)); width: calc(26 * var(--u)); height: calc(26 * var(--u)); transform-origin: 20% 12%; filter: drop-shadow(0 calc(1 * var(--u)) calc(2 * var(--u)) rgba(0, 0, 0, 0.3)); }
.pointer .cross { display: none; top: calc(-11 * var(--u)); left: calc(-11 * var(--u)); width: calc(22 * var(--u)); height: calc(22 * var(--u)); }
.pointer.crosshair .arrow { display: none; }
.pointer.crosshair .cross { display: block; }
.pointer.down .arrow { transform: scale(0.86); }

/* Subtitles: what the tester says, inside the picture like a video's captions. The box takes the
   whole sentence's size at once, and the words appear in it as they're spoken. */
.say {
  position: absolute;
  bottom: clamp(10px, 2.6cqw, 26px);
  left: 50%;
  z-index: 11;
  width: max-content;
  max-width: min(88%, 34em);
  padding: 0.3em 0.7em;
  font-size: clamp(14px, 1.85cqw, 18px);
  font-weight: 500;
  line-height: 1.4;
  color: #fff;
  text-align: center;
  text-wrap: balance;
  background: rgba(0, 0, 0, 0.74);
  border-radius: 0.45em;
  transform: translateX(-50%);
}
.say:empty, .say.swap { opacity: 0; }
.say.swap { filter: blur(2px); }
.say .w { transition: opacity 160ms ease; }
.say .w.off { opacity: 0; }
.say { transition: opacity 180ms ease, filter 180ms ease; }

/* asides on a frozen screen, drawn after the overlay itself (asides-overlay's ui.rs and style.rs).
   The menu bar is part of the frozen picture, so it stays: the pill comes in under it, glass with a
   hairline, its microphone soft red while listening and filling with how loud it hears. Measurements
   are pink lines with dark labels, pins numbered blue markers where they were clicked. */
.apill {
  position: absolute;
  top: calc(47 * var(--u));
  left: 50%;
  z-index: 7;
  display: flex;
  align-items: center;
  gap: calc(4 * var(--u));
  height: calc(38 * var(--u));
  padding: 0 calc(4 * var(--u));
  color: rgba(255, 255, 255, 0.88);
  font: 400 calc(13 * var(--u))/1 var(--sans);
  white-space: nowrap;
  background: rgba(28, 27, 26, 0.66);
  -webkit-backdrop-filter: blur(calc(20 * var(--u))) saturate(1.3);
  backdrop-filter: blur(calc(20 * var(--u))) saturate(1.3);
  border: calc(1 * var(--u)) solid rgba(255, 255, 255, 0.1);
  border-radius: calc(12 * var(--u));
  opacity: 0;
  transform: translateX(-50%) scale(0.98);
  transition: opacity 160ms ease-out, transform 160ms ease-out;
}
.apill.on { opacity: 1; transform: translateX(-50%); }
.apill svg { position: relative; width: calc(16 * var(--u)); height: calc(16 * var(--u)); fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ap-icon, .ap-mic, .ap-send { position: relative; display: grid; place-items: center; width: calc(28 * var(--u)); height: calc(28 * var(--u)); overflow: hidden; border-radius: calc(8 * var(--u)); }
.ap-mic.listening { color: #fff; background: rgba(236, 106, 94, 0.32); }
.ap-mic .level { position: absolute; inset: auto 0 0; height: 0; background: #ec6a5e; transition: height 90ms linear; }
.ap-to { padding: 0 calc(16 * var(--u)) 0 calc(8 * var(--u)); }
.ap-tool { display: none; align-items: center; gap: calc(6 * var(--u)); height: calc(28 * var(--u)); padding: 0 calc(10 * var(--u)); margin-right: calc(12 * var(--u)); border-radius: calc(8 * var(--u)); background: rgba(255, 255, 255, 0.07); }
.ap-tool svg { width: calc(14 * var(--u)); height: calc(14 * var(--u)); }
.apill.measuring .ap-tool { display: flex; }
.ap-send { width: calc(32 * var(--u)); color: #16213a; background: #c2d6f6; }

.ruler, .outline, .marker { position: absolute; z-index: 6; opacity: 0; pointer-events: none; }
.ruler, .outline { left: calc(var(--bx, 0) * var(--u)); top: calc(var(--by, 0) * var(--u)); height: calc(var(--bh, 0) * var(--u)); }
.ruler { width: calc(1.5 * var(--u)); background: #ff2d55; }
.ruler::before, .ruler::after { content: ""; position: absolute; left: calc(-4 * var(--u)); width: calc(9.5 * var(--u)); height: calc(1.5 * var(--u)); background: #ff2d55; }
.ruler::before { top: 0; }
.ruler::after { bottom: 0; }
.ruler i {
  position: absolute;
  top: 50%;
  right: calc(10 * var(--u));
  padding: calc(3 * var(--u)) calc(7 * var(--u));
  font: 700 calc(12 * var(--u))/1 var(--sans);
  font-style: normal;
  color: #fff;
  background: rgba(28, 28, 30, 0.92);
  border-radius: calc(6 * var(--u));
  transform: translateY(-50%);
}
.outline { width: calc(var(--bw, 0) * var(--u)); border: calc(1.5 * var(--u)) solid #3b82f6; border-radius: calc(4 * var(--u)); }
.ruler.on, .outline.on { opacity: 1; }
.marker {
  left: calc(var(--bx, 0) * var(--u));
  top: calc(var(--by, 0) * var(--u));
  display: grid;
  place-items: center;
  width: calc(22 * var(--u));
  height: calc(22 * var(--u));
  font: 700 calc(12 * var(--u))/1 var(--sans);
  color: #fff;
  background: #3b82f6;
  border-radius: 50%;
  box-shadow: 0 0 0 calc(2.5 * var(--u)) #fff, 0 calc(2 * var(--u)) calc(6 * var(--u)) rgba(0, 0, 0, 0.3);
  transform: translate(-50%, -50%) scale(0.4);
  transition: opacity 120ms ease, transform 260ms var(--ease-out);
}
.marker.on { opacity: 1; transform: translate(-50%, -50%); }
</style>
</head>

      <figure class="device" id="demo">

          <!-- The markup is the demo's last frame, so it reads fine without JavaScript. -->
          <div class="desk" aria-hidden="true">
